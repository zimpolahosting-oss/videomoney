name: Deploy Firebase Functions

on:
  push:
    branches: ["main"]
    paths:
      - "firebase.json"
      - "functions/**"
      - ".github/workflows/firebase-deploy-functions.yml"
  workflow_dispatch: {}

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate deploy configuration
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "Missing secret FIREBASE_PROJECT_ID"
            exit 1
          fi
          if [ -z "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            echo "Missing credentials file path from auth step"
            exit 1
          fi

      - name: Configure gcloud project
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: gcloud config set project "$FIREBASE_PROJECT_ID"

      - name: Show authenticated principal
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          echo "Firebase project: $FIREBASE_PROJECT_ID"
          echo "Credentials file: $GOOGLE_APPLICATION_CREDENTIALS"
          echo "Active gcloud account(s):"
          gcloud auth list
          echo "Resolved ADC principal:"
          python3 - <<'PY'
          import json, os
          path = os.environ.get("GOOGLE_APPLICATION_CREDENTIALS")
          if not path:
              raise SystemExit("GOOGLE_APPLICATION_CREDENTIALS not set")
          with open(path, "r", encoding="utf-8") as fh:
              data = json.load(fh)
          print(data.get("client_email", "client_email not found"))
          PY

      - name: Verify Secret Manager access
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          gcloud secrets versions access latest \
            --secret="PLAYERS_ARE_GAMERS_API_KEY" \
            --project="$FIREBASE_PROJECT_ID" > /dev/null
          echo "Secret Manager access verified for PLAYERS_ARE_GAMERS_API_KEY"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "functions/package-lock.json"

      - name: Install latest Firebase CLI
        run: |
          npm uninstall -g firebase-tools || true
          npm install -g firebase-tools@latest
          firebase --version

      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Remove conflicting 1st Gen functions
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          LEGACY_GEN1_FUNCTIONS: "dispatchAnimation"
          LEGACY_FUNCTION_REGION: "europe-west1"
        run: |
          echo "Checking for conflicting 1st Gen functions in ${LEGACY_FUNCTION_REGION}..."
          for FUNCTION_NAME in $LEGACY_GEN1_FUNCTIONS; do
            if gcloud functions describe "$FUNCTION_NAME" \
              --region="$LEGACY_FUNCTION_REGION" \
              --project="$FIREBASE_PROJECT_ID" > /dev/null 2>&1; then
              echo "Deleting legacy 1st Gen function: ${FUNCTION_NAME}"
              gcloud functions delete "$FUNCTION_NAME" \
                --region="$LEGACY_FUNCTION_REGION" \
                --project="$FIREBASE_PROJECT_ID" \
                --quiet
            else
              echo "No legacy 1st Gen function found for ${FUNCTION_NAME}"
            fi
          done

      - name: Deploy functions
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.auth.outputs.credentials_file_path }}
          GOOGLE_GHA_CREDS_PATH: ${{ steps.auth.outputs.credentials_file_path }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          GCLOUD_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: firebase deploy --only functions --project "$FIREBASE_PROJECT_ID" --force --debug
